<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b10">
    <title>Now playing — VedantFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="screening-page">
    <header class="screening-header">
        <a class="logo" href="index.html" aria-label="VedantFlix home">Vedant<span>Flix</span></a>
        <a class="screening-back" href="index.html"><span aria-hidden="true">←</span> Browse titles</a>
    </header>
    <main class="screening-main">
        <section class="screening-intro" aria-labelledby="player-title">
            <div class="screening-status"><i></i> YOUR SCREENING ROOM</div>
            <h1 id="player-title">Your feature film</h1>
            <p>Get comfortable and enjoy the show.</p>
        </section>
        <div class="screening-frame">
            <div class="player-loading" id="player-loading"><span class="loader-ring"></span><strong>Preparing your movie</strong><small>Your screening room is almost ready</small></div>
            <iframe id="videoPlayer" title="VedantFlix movie player" allowfullscreen webkitallowfullscreen loading="eager" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
        </div>
        <section class="screening-actions" aria-label="Playback options">
            <div class="screening-actions-copy"><strong>Playback not starting?</strong><span>Open the video directly in Google Drive.</span></div>
            <a id="open-drive" class="drive-action" href="https://drive.google.com" target="_blank" rel="noopener noreferrer">Open video <span aria-hidden="true">↗</span></a>
        </section>
        <footer class="screening-footer"><span>VEDANTFLIX <i>•</i> MADE FOR MOVIE NIGHTS</span><a href="episodes.html">View title details <span aria-hidden="true">→</span></a></footer>
    </main>
    <script src="script.js"></script>
    <script>
        const currentShow = localStorage.getItem("show");
        const currentTitle = titles[Number(currentShow?.slice(4)) - 1]?.[0];
        const currentVideo = localStorage.getItem("videoId");
        if (currentTitle) document.getElementById("player-title").textContent = currentTitle;
        const player = document.getElementById("videoPlayer");
        if (currentVideo) {
            const driveId = normalizeDriveId(currentVideo);
            const driveUrl = `https://drive.google.com/file/d/${encodeURIComponent(driveId)}/view`;
            player.src = `https://drive.google.com/file/d/${encodeURIComponent(driveId)}/preview`;
            document.getElementById("open-drive").href = driveUrl;
            player.addEventListener("load", () => document.getElementById("player-loading").classList.add("is-hidden"), { once: true });
            window.setTimeout(() => document.getElementById("player-loading").classList.add("is-hidden"), 5000);
        } else {
            document.getElementById("open-drive").hidden = true;
            document.getElementById("player-loading").innerHTML = '<strong>No movie selected</strong><a href="index.html">Browse the collection →</a>';
        }
    </script>
</body>
</html>
